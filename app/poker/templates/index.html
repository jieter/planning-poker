{% load static %}
{% load vite %}

<!doctype html>
<html lang="en">
    <head>
        <title>Planning poker</title>
        <meta name="color-scheme" content="light dark">
        <script>
            // Apply the stored theme ('light', 'dark' or 'auto') before first paint, using Bootstrap's color modes.
            // 'auto' follows the OS color scheme. Keep in sync with applyTheme() in js/utils.ts.
            (() => {
                const query = window.matchMedia('(prefers-color-scheme: dark)');
                const setTheme = () => {
                    const theme = localStorage.getItem('theme') || 'auto';
                    const dark = theme == 'auto' ? query.matches : theme == 'dark';
                    document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
                };
                setTheme();
                query.addEventListener('change', setTheme);
            })();
        </script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

        <meta property="og:type" content="website">
        <meta property="og:title" content="Planning poker">
        <meta property="og:url" content="{{ absolute_url }}{{ request.path }}">
        <meta property="og:image" content="{{ absolute_url }}{% static 'opengraph.png' %}">
        <meta property="og:description" content="Join {{ users }} in a planning poker session.">
    </head>
    <body>
        <div id="poker" class="m-1"></div>

        {% if statistics %}
            {{ statistics|json_script:'statistics' }}
        {% endif %}
        {{ websocket_url|json_script:"websocket_url" }}
        {% vite_hmr %}
        {% vite 'js/index.ts' %}
    </body>
</html>
